name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EbonholdAddonManager.slnx

      - name: Publish
        run: dotnet publish EbonholdAddonManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish\* -DestinationPath EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip

      - name: Scan with VirusTotal
        id: vt
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          body: |
            🛡️ Scan VirusTotal : ${{ steps.vt.outputs.analysis }}
