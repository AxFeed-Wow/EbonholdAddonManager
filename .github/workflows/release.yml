name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore EbonholdAddonManager.slnx

      - name: Publish
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish EbonholdAddonManager.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=$v -o publish

      - name: Zip artifact
        run: Compress-Archive -Path publish\* -DestinationPath EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip

      - name: Compute SHA-256
        run: |
          $zip = "EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File "$zip.sha256" -Encoding ascii -NoNewline

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip
            EbonholdAddonManager-${{ github.ref_name }}-win-x64.zip.sha256
          generate_release_notes: true
          token: ${{ secrets.RELEASE_TOKEN }}

  virustotal-scan:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.event.release.tag_name }} --pattern "*.zip" --repo ${{ github.repository }}

      - name: Scan with VirusTotal
        uses: crazy-max/ghaction-virustotal@v4
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          update_release_body: true
          files: |
            ./*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
